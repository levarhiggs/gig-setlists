<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Setlist Organizer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=20261031b">
</head>
<body>
<header class="top-bar">
  <span class="app-title">Setlist Organizer</span>
  <div class="top-bar-actions">
    <button id="player-mode-btn" class="btn-icon" aria-pressed="false" aria-label="Toggle player mode">&#9654;</button>
    <button id="link-mode-btn" class="btn-icon" aria-pressed="false" aria-label="Toggle link mode">&#128279;</button>
    <div class="add-menu-wrap">
      <button id="add-btn" class="btn-secondary">Add+</button>
      <div id="add-menu" class="dropdown-menu hidden">
        <button class="dropdown-item" data-action="new-gig">New Gig</button>
        <button class="dropdown-item" data-action="add-set">Add Set</button>
        <button class="dropdown-item" data-action="add-song">Add Song</button>
        <button class="dropdown-item" data-action="bulk-import">Bulk Import</button>
        <button class="dropdown-item" data-action="attach-audio">Attach Audio Files…</button>
        <button class="dropdown-item" data-action="open-saved">Open Saved Gig…</button>
        <button class="dropdown-item" data-action="save-backup">Save Backup…</button>
        <button class="dropdown-item" data-action="restore-backup">Restore from Backup…</button>
      </div>
    </div>
    <input type="file" id="import-file" accept=".xlsx" hidden>
    <div class="add-menu-wrap">
      <button id="export-btn" class="btn-icon" aria-label="Export setlist" title="Export / Print"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z" fill="#171a23"/></svg></button>
      <div id="export-menu" class="dropdown-menu hidden">
        <button class="dropdown-item" data-action="print">Print…</button>
        <button class="dropdown-item" data-action="image">Save as Image (PNG)</button>
        <button class="dropdown-item" data-action="text">Save as Text File</button>
        <button class="dropdown-item" data-action="copy">Copy Text</button>
      </div>
    </div>
    <button id="save-btn" class="btn-secondary">Save</button>
  </div>
</header>

<main id="gig-view" class="gig-view">
  <p class="empty-hint">Loading gig…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
  // Service workers don't apply under Electron (no real network origin to
  // cache against) and window.electronAPI only exists there — see
  // electron/preload.js.
  if ('serviceWorker' in navigator && !window.electronAPI) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
